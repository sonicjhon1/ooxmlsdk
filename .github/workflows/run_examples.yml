name: Run examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchains
        uses: ./.github/workflows/setup-toolchains
        with:
          build: "true"

      - name: Run read_write
        run: cargo run --example read_write --features="docx pptx xlsx office2010 parts validators"
